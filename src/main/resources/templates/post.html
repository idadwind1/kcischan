<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title th:text="${post.title} + ' - Kcischan'">Thread</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/markdown.css" />
  <script src="/assets/js/markdown.js"></script>
  <script src="/assets/js/captcha.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <header>
    <a th:if="${post.parentId}" th:href="@{'/post/' + ${post.parentId}}">&larr; Back to Parent Post</a>
    <a th:unless="${post.parentId}" th:href="@{'/board/' + ${post.board}}">&larr; Back to Board</a>
    <div class="box">
      <h1 th:text="${post.title}">Thread Title</h1>
      <div class="subtitle">

        <th:block th:insert="~{fragments/post :: description(${post}, false)}" />
      </div>
    </div>
  </header>

  <main>
    <div class="box" th:insert="~{fragments/post :: content(${post})}"></div>

    <th:block th:insert="~{fragments/post :: postForm(${post.board}, ${post.id}, ${isAdmin})}" />

    <div>
      <h1>Replies</h1>
      <h2 th:if="${#lists.isEmpty(replies)}">Nothing is here... yet</h2>
    </div>

    <div class="gap-2 flex-vertical">
      <th:block th:each="reply : ${replies}">
        <th:block th:insert="~{fragments/post :: postCard(${reply}, false, true)}" />
      </th:block>
    </div>
  </main>

  <script src="/assets/js/postForm.js"></script>
</body>

</html>
