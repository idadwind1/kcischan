<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title th:text="'Board ' + ${board.id} + ' - Kcischan'">Board</title>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/captcha.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-pink-50 dark:bg-gray-900 min-h-screen p-6 text-pink-900 dark:text-white">
  <header class="mb-6">
    <a href="/" class="text-pink-500 hover:underline dark:text-pink-300">&larr; Back to Homepage</a>
    <h1 class="text-5xl font-bold text-center text-pink-600 dark:text-pink-300"
      th:text="${board.id} + ': ' + ${board.name}">Board</h1>
    <p class="text-center text-pink-700 dark:text-pink-200" th:text="${board.description}">Board description here~</p>
  </header>

  <main class="max-w-4xl mx-auto">
    <form class="post-form bg-white dark:bg-gray-800 p-6 rounded-2xl mb-6 border border-pink-100 dark:border-gray-700">
      <input type="hidden" name="board" th:value="${board.id}" />
      <input type="text" name="title" placeholder="Title"
        class="w-full p-2 border border-pink-200 dark:border-gray-600 bg-white dark:bg-gray-900 rounded mb-3 focus:outline-none focus:ring-2 focus:ring-pink-300" />

      <textarea id="content" name="content" placeholder="Content..."
        class="w-full p-2 border border-pink-200 dark:border-gray-600 bg-white dark:bg-gray-900 rounded focus:outline-none focus:ring-2 focus:ring-pink-300"></textarea>
      <span class="block flex justify-end mb-3 text-pink-500 dark:text-pink-300">
        <a href="https://en.wikipedia.org/wiki/Markdown">
          <svg aria-hidden="true" focusable="false" class="octicon octicon-markdown" viewBox="0 0 16 16" width="16"
            height="16" fill="currentColor" display="inline-block" overflow="visible"
            style="vertical-align: text-bottom;">
            <path
              d="M14.85 3c.63 0 1.15.52 1.14 1.15v7.7c0 .63-.51 1.15-1.15 1.15H1.15C.52 13 0 12.48 0 11.84V4.15C0 3.52.52 3 1.15 3ZM9 11V5H7L5.5 7 4 5H2v6h2V8l1.5 1.92L7 8v3Zm2.99.5L14.5 8H13V5h-2v3H9.5Z">
            </path>
          </svg>
        </a>
      </span>
      <label for="file" class="block text-sm text-pink-500 dark:text-pink-300 mb-2">Attachment: </label>
      <input type="file" name="attachment" id="file" class="mb-3" />
      <br />
      <img src="/captcha.jpg" class="mb-3" id="captcha" />
      <input type="captcha" name="captcha" id="captcha_input" placeholder="Solve captcha"
        class="p-2 mr-1 border border-pink-200 dark:border-gray-600 bg-white dark:bg-gray-900 rounded mb-3 focus:outline-none focus:ring-2 focus:ring-pink-300" />
      <button type="submit" th:unless="${isAdmin}"
        class="shadow-pink-900 hover:shadow-ig bg-pink-500 text-white px-4 py-2 rounded hover:bg-pink-600 transition dark:bg-pink-400 dark:hover:bg-pink-500">
        Post
      </button>

      <div th:if="${isAdmin}">
        <button type="submit"
          class="shadow-pink-900 hover:shadow-ig bg-pink-500 text-white px-4 py-2 rounded hover:bg-pink-600 transition dark:bg-pink-400 dark:hover:bg-pink-500">
          Post As Admin
        </button>
        <a class="cursor-pointer ml-1 text-pink-400 hover:underline dark:text-pink-300" id="logout-admin">Logout</a>
      </div>
    </form>
    <p id="post-status" class="text-center text-pink-400 dark:text-pink-200 italic"></p>

    <ul class="space-y-4">
      <p th:if="${#lists.isEmpty(threads)}" class="text-pink-300 dark:text-pink-200 text-4xl text-center my-10">Nothing
        is here... yet</p>

      <li th:if="${pinnedPost}"
        class="bg-white dark:bg-gray-800 rounded-xl p-4 hover:bg-pink-100 dark:hover:bg-gray-700 transition cursor-pointer border border-pink-100 dark:border-gray-700">
        <a th:href="@{'/post/' + ${pinnedPost.id}}">
          <p th:text="'📌 ' + ${pinnedPost.title}"
            class="block text-xl font-bold text-pink-500 dark:text-pink-300 hover:underline">
            Title
          </p>
          <p th:if="${pinnedPost.deleted}" class="mt-1 text-sm" style="color: red;">Deleted</p>
          <p th:if="${pinnedPost.fromAdmin}" class="mt-1 text-sm" style="color: red;">From Admin</p>
          <p class="text-pink-400 dark:text-pink-200 mt-1 text-sm"
            th:text="'Pinned; ' + ${pinnedPost.id} + '; Started on ' + ${pinnedPost.createdAt}">
            Thread Info
          </p>
        </a>
      </li>

      <li th:each="thread : ${threads}" th:unless="${pinnedPost != null && thread.id == pinnedPost.id}"
        class="bg-white dark:bg-gray-800 rounded-xl p-4 hover:bg-pink-100 dark:hover:bg-gray-700 transition cursor-pointer border border-pink-100 dark:border-gray-700">
        <a th:href="@{'/post/' + ${thread.id}}">
          <p th:text="${thread.title}" class="block text-xl font-bold text-pink-500 dark:text-pink-300 hover:underline">
            Thread Title</p>
          <p th:if="${thread.fromAdmin}" class="mt-1 text-sm" style="color: red;">From Admin</p>
          <p th:if="${thread.deleted}" class="mt-1 text-sm" style="color: red;">Deleted</p>
          <p class="text-pink-400 dark:text-pink-200 mt-1 text-sm"
            th:text="${thread.id} + '; Started on ' + ${thread.createdAt}">
            Thread Info
          </p>
        </a>
      </li>
    </ul>
  </main>

  <script src="/assets/js/postForm.js"></script>
</body>

</html>
