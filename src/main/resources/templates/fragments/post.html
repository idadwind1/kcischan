<!-- Description -->
<div th:fragment="description(post, isPinned, showBoard)">
  <p th:unless="${post.author}" class="text-normal">来自 匿名</p>
  <p th:if="${post.author}" th:text="@{'来自 ' + ${post.author}}" class="text-normal">来自</p>
  <p th:if="${showBoard}" th:text="@{'板块: ' + ${post.board}}" class="text-normal"></p>
  <p th:if="${post.fromAdmin}" style="color: red;">来自管理员</p>
  <p th:if="${post.deleted}" style="color: red;">已删除</p>
  <p>
    <span th:if="${isPinned}">已置顶；</span>
    <span th:text="${post.id} + '；发表于 ' + ${post.createdAt}"></span>
  </p>
</div>

<!-- Content -->
<div th:fragment="content(post)">
  <div th:if="${post.attachmentExtension != null}">
  </div>

  <div class="markdown-content" th:text="${post.content}">帖子内容</div>
</div>

<!-- post card -->
<div th:fragment="postCard(post, isPinned, showContent, showBoard)" class="card box">
  <a th:href="@{'/post/' + ${post.id}}" class="no-underline">
    <div class="bold">
      <div th:if="${isPinned}">📌</div>
      <div th:text="${post.title}">帖子标题</div>
    </div>

    <div class="text-small" th:insert="~{this :: description(${post}, ${isPinned}, ${showBoard})}">
    </div>
  </a>

  <th:block th:if="${showContent}" th:insert="~{this :: content(${post})}" />
</div>

<!-- form -->
<form th:fragment="postForm(board, parent, isAdmin)" class="box post-form spacey-1">
  <input type="text" name="title" placeholder="标题" required />
  <input type="text" name="author" placeholder="作者（可选）" />
  <input type="hidden" name="board" th:value="${board}" />
  <input type="hidden" name="parent_id" th:value="${parent}" />
  <div>
    <textarea id="content" name="content" placeholder="内容……（至少10个字符）" required></textarea>
    <p class="flex-rightmost">
      <a href="https://en.wikipedia.org/wiki/Markdown" title="支持 Markdown">
        <svg aria-hidden="true" focusable="false" class="octicon octicon-markdown" viewBox="0 0 16 16" width="16"
          height="16" fill="currentColor" display="inline-block" overflow="visible"
          style="vertical-align: text-bottom;">
          <path
            d="M14.85 3c.63 0 1.15.52 1.14 1.15v7.7c0 .63-.51 1.15-1.15 1.15H1.15C.52 13 0 12.48 0 11.84V4.15C0 3.52.52 3 1.15 3ZM9 11V5H7L5.5 7 4 5H2v6h2V8l1.5 1.92L7 8v3Zm2.99.5L14.5 8H13V5h-2v3H9.5Z">
          </path>
        </svg>
      </a>
    </p>
  </div>

  <div class="no-margin">
    <label for="file" class="color-accent">附件（可选）：</label>
    <input type="file" name="attachment" id="file" />
  </div>

  <img src="/captcha.jpg" id="captcha" />

  <div>
    <input class="auto-width" type="text" name="captcha" id="captcha_input" placeholder="请输入验证码" />
    <button type="submit" th:unless="${isAdmin}">发布</button>
  </div>

  <div th:if="${isAdmin}">
    <button type="submit">以管理员身份发布</button>
    <a id="logout-admin" href="javascript:void(0)">退出登录</a>
  </div>
  <span id="post-status" class="status-label"></span>
</form>
